name: Package platform VSIXs

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Version already present in package.json (for example 0.1.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  package-native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
            binding: win32-x64
          - runner: windows-11-arm
            target: win32-arm64
            binding: win32-arm64
          - runner: ubuntu-24.04
            target: linux-x64
            binding: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            binding: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
            binding: darwin-x64
          - runner: macos-15
            target: darwin-arm64
            binding: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install webview dependencies
        working-directory: webview-ui
        run: npm ci

      - name: Verify version and DuckDB binding
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          DUCKDB_BINDING: ${{ matrix.binding }}
        run: node scripts/verify-release-target.mjs

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package targeted VSIX
        run: npm run package

      - name: Upload targeted VSIX
        uses: actions/upload-artifact@v7
        with:
          name: quackwrangler-${{ matrix.target }}-${{ inputs.expected_version }}
          path: quackwrangler-${{ matrix.target }}-${{ inputs.expected_version }}.vsix
          if-no-files-found: error
          retention-days: 14

  package-alpine:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: alpine-x64
            binding: linux-x64-musl
          - runner: ubuntu-24.04-arm
            target: alpine-arm64
            binding: linux-arm64-musl
    runs-on: ${{ matrix.runner }}
    container: node:20-alpine
    steps:
      - name: Install runner tools
        run: apk add --no-cache git

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install webview dependencies
        working-directory: webview-ui
        run: npm ci

      - name: Verify version and DuckDB binding
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          DUCKDB_BINDING: ${{ matrix.binding }}
        run: node scripts/verify-release-target.mjs

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package targeted VSIX
        run: npm run package

      - name: Upload targeted VSIX
        uses: actions/upload-artifact@v7
        with:
          name: quackwrangler-${{ matrix.target }}-${{ inputs.expected_version }}
          path: quackwrangler-${{ matrix.target }}-${{ inputs.expected_version }}.vsix
          if-no-files-found: error
          retention-days: 14
