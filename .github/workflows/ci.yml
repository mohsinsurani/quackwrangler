name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install webview dependencies
        working-directory: webview-ui
        run: npm ci

      - name: Set up Python tooling for Polars recipe tests
        if: matrix.node-version == 24
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Audit production dependencies
        if: matrix.node-version == 22
        run: npm run security:audit

      - name: Build
        run: npm run build

      - name: Test
        if: matrix.node-version == 24
        run: npm test -- --exclude tests/unit/polars/**

      - name: Test with coverage thresholds
        if: matrix.node-version == 22
        run: npm run test:coverage

      - name: Test Polars recipe integration
        if: matrix.node-version == 24
        env:
          QW_POLARS_INTEGRATION: '1'
        run: npm test -- tests/unit/polars/recipe.test.ts

      - name: Upload coverage report
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: extension-build
          path: dist/
          retention-days: 7

  # The same unit and integration tests on Windows, which differs from Linux and macOS in line
  # endings (CRLF), path separators, file locking, and error wording. Releases are packaged on
  # Windows, so a Windows-only failure should surface on the pull request, not at release time.
  windows:
    name: windows (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install webview dependencies
        working-directory: webview-ui
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --exclude tests/unit/polars/**
