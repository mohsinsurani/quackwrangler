version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]
    groups:
      extension-dependencies:
        patterns: ["*"]
        exclude-patterns: ["@azure/*", "@typescript-eslint/*", "@vscode/vsce"]

  - package-ecosystem: npm
    directory: /webview-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]
    groups:
      webview-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]
    groups:
      github-actions:
        patterns: ["*"]
